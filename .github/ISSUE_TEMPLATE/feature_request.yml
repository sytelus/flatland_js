name: Feature request
description: Propose an improvement to the experiment.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What becomes easier to understand or do with this change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior and how it fits the project's small, dependency-free design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe simpler approaches or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, references, or examples if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar proposals.
          required: true
